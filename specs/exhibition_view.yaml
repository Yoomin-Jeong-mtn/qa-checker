event: exhibition_view
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - MW
  - PC
  - iOS_APP
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: false
  allow_empty: true
- key: exhibition_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: exhibition_name
  type: string
  required: true
  allow_empty: false
- key: exhibition_start_date
  type: string
  required: true
  allow_empty: false
- key: exhibition_end_date
  type: string
  required: true
  allow_empty: false
- key: exhibition_deeplink
  type: string
  required: true
  allow_empty: false
- key: exhibition_mw_url
  type: string
  required: true
  allow_empty: false
