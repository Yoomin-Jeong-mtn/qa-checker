event: search_complete
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - MW
  - PC
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: false
  allow_empty: true
- key: service_tab
  type: string
  required: true
  allow_empty: false
  enum:
  - 통합검색
  - 마트플러스
  - 아마존
  - ootd
  - 우아럭스
- key: search_keyword
  type: string
  required: true
  allow_empty: false
- key: search_result_count
  type: number
  required: true
  allow_empty: false
- key: is_online_best_product
  type: boolean
  required: true
  allow_empty: false
- key: related_keyword
  type: string
  required: true
  allow_empty: false
