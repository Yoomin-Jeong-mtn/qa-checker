event: remove_from_cart
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - MW
  - PC
  - iOS_APP
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: false
  allow_empty: true
- key: product_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: product_name
  type: string
  required: true
  allow_empty: false
- key: opt_product_name
  type: string
  required: true
  allow_empty: false
- key: product_quantity
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
