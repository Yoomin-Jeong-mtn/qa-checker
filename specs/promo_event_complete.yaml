event: promo_event_complete
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - MW
  - PC
  - iOS_APP
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: false
  allow_empty: true
- key: event_id
  type: string
  required: true
  allow_empty: false
  pattern: ^\d{8}-.+$
- key: event_tmtr
  type: string
  required: true
  allow_empty: false
  pattern: ^\d{6}$
- key: event_tmtr_completed_time
  type: string
  required: true
  allow_empty: false
