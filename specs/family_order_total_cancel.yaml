- key: is_gift
  type: boolean
  required: true
  allow_empty: false
- key: product_no_list
  type: string
  required: true
  allow_empty: false
- key: opt_product_no_list
  type: string
  required: true
  allow_empty: false
- key: product_name_list
  type: string
  required: true
  allow_empty: false
- key: opt_product_name_list
  type: string
  required: true
  allow_empty: false
- key: product_quantity_list
  type: string
  required: true
  allow_empty: false
