event: push_unsubscribe
properties:
  - key: platform
    type: string
    required: true
    enum: [PC, ANDROID_APP, IOS_APP, iOS_APP, MW]
    allow_empty: false
  - key: is_logged_in
    type: boolean
    required: true
    allow_empty: false
  - key: partner_code
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
