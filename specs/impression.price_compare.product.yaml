event: impression.price_compare.product
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: service_type
  type: string
  required: true
  allow_empty: false
  enum:
  - OM
  - 리테일
  - 우아럭스
  - 마트플러스
- key: product_no
  type: string
  required: true
  allow_empty: false
- key: opt_product_no
  type: string
  required: true
  allow_empty: false
- key: product_name
  type: string
  required: true
  allow_empty: false
- key: product_image_url
  type: string
  required: true
  allow_empty: false
- key: store_no
  type: string
  required: true
  allow_empty: false
- key: store_name
  type: string
  required: true
  allow_empty: false
- key: flag
  type: string
  required: true
  allow_empty: true
- key: review_count
  type: number
  required: true
  allow_empty: false
- key: review_score
  type: number
  required: true
  allow_empty: false
- key: original_price
  type: number
  required: true
  allow_empty: false
- key: discount_percent
  type: number
  required: true
  allow_empty: false
- key: discount_price
  type: number
  required: true
  allow_empty: false
- key: discount_amount
  type: number
  required: true
  allow_empty: false
- key: deal_name
  type: string
  required: false
  allow_empty: true
  enum:
  - 타임딜
  - 쇼킹딜
  - 아마존딜
- key: deal_end_time
  type: datetime
  required: false
  allow_empty: false
- key: deal_sold_count
  type: number
  required: true
  allow_empty: false
- key: delivery_expect_date
  type: string
  required: true
  allow_empty: false
- key: delivery_fee
  type: number
  required: true
  allow_empty: false
- key: delivery_free_price
  type: number
  required: true
  allow_empty: false
- key: prd_svc_grp_cd
  type: string
  required: true
  allow_empty: false
- key: prd_svc_grp_dtl_cd
  type: string
  required: false
  allow_empty: false
- key: large_category_name
  type: string
  required: true
  allow_empty: false
- key: middle_category_name
  type: string
  required: true
  allow_empty: false
- key: small_category_name
  type: string
  required: true
  allow_empty: false
- key: detail_category_name
  type: string
  required: true
  allow_empty: true
- key: display_category_name
  type: string
  required: true
  allow_empty: false
- key: large_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: middle_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: small_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: detail_category_no
  type: string
  required: true
  allow_empty: true
- key: display_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: catalog_no
  type: string
  required: true
  allow_empty: true
- key: bundle_catalog_group_no
  type: string
  required: true
  allow_empty: false
- key: is_sale
  type: boolean
  required: true
  allow_empty: false
- key: is_adult_product
  type: boolean
  required: true
  allow_empty: false
- key: path
  type: string
  required: false
  allow_empty: false
  condition_when:
    key: platform
    value: MW
  condition_note: platform이 MW일 때만 수집
