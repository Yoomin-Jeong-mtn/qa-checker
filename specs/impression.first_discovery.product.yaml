event: impression.first_discovery.product
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: tab_name
  type: string
  required: true
  allow_empty: false
- key: service_type
  type: string
  required: true
  allow_empty: false
  enum:
  - OM
  - 우아럭스
  - 마트플러스
- key: product_no
  type: string
  required: true
  allow_empty: false
- key: product_name
  type: string
  required: true
  allow_empty: false
- key: store_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: store_name
  type: string
  required: true
  allow_empty: false
- key: large_category_name
  type: string
  required: true
  allow_empty: false
- key: middle_category_name
  type: string
  required: true
  allow_empty: false
- key: small_category_name
  type: string
  required: true
  allow_empty: false
- key: detail_category_name
  type: string
  required: true
  allow_empty: false
- key: large_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: middle_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: small_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: detail_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
