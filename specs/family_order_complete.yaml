event: family_order_complete
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: true
  allow_empty: false
- key: order_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: payment_method
  type: string
  required: true
  allow_empty: false
- key: product_no
  type: string
  required: true
  allow_empty: false
- key: product_name
  type: string
  required: true
  allow_empty: false
- key: opt_product_name
  type: string
  required: true
  allow_empty: false
- key: product_quantity
  type: number
  required: true
  allow_empty: false
- key: original_price
  type: number
  required: true
  allow_empty: false
- key: is_sale
  type: boolean
  required: true
  allow_empty: false
- key: discount_percent
  type: number
  required: true
  allow_empty: false
- key: discount_amount
  type: number
  required: true
  allow_empty: false
- key: discount_price
  type: number
  required: true
  allow_empty: false
- key: delivery_fee
  type: number
  required: true
  allow_empty: false
- key: large_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: middle_category_no
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: request_member
  type: string
  required: true
  allow_empty: false
