event: impression.beautyplus.product
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: tab_name
  type: string
  required: true
  allow_empty: false
- key: path
  type: string
  required: false
  allow_empty: false
  condition_when:
    key: platform
    value: MW
  condition_note: platform이 MW일 때만 수집
