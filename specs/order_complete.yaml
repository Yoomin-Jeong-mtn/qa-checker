event: order_complete
properties:
  - key: platform
    type: string
    required: true
    enum: [PC, ANDROID_APP, IOS_APP, iOS_APP, MW]
    allow_empty: false
  - key: is_logged_in
    type: boolean
    required: true
    allow_empty: false
  - key: partner_code
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: order_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: payment_method
    type: string
    required: true
    allow_empty: false
  - key: product_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: opt_product_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: product_name
    type: string
    required: true
    allow_empty: false
  - key: opt_product_name
    type: string
    required: true
    allow_empty: false
  - key: product_quantity
    type: number
    required: true
    allow_empty: false
  - key: original_price
    type: number
    required: true
    allow_empty: false
  - key: discount_amount
    type: number
    required: true
    allow_empty: false
  - key: discount_price
    type: number
    required: true
    allow_empty: false
  - key: discount_percent
    type: number
    required: true
    allow_empty: false
  - key: is_sale
    type: boolean
    required: true
    allow_empty: false
  - key: delivery_fee
    type: number
    required: true
    allow_empty: false
  - key: delivery_type
    type: string
    required: false
    allow_empty: true
  - key: store_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: large_category_name
    type: string
    required: true
    allow_empty: false
  - key: middle_category_name
    type: string
    required: true
    allow_empty: false
  - key: small_category_name
    type: string
    required: true
    allow_empty: false
  - key: detail_category_name
    type: string
    required: false
    allow_empty: true
  - key: display_category_name
    type: string
    required: true
    allow_empty: false
  - key: large_category_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: middle_category_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: small_category_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
  - key: detail_category_no
    type: string
    required: false
    pattern: '^\d+$'
    allow_empty: true
  - key: display_category_no
    type: string
    required: true
    pattern: '^\d+$'
    allow_empty: false
