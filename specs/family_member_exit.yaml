event: family_member_exit
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - MW
  - PC
  - iOS_APP
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: false
  allow_empty: true
- key: exit_member
  type: boolean
  required: true
  allow_empty: false
- key: family_role
  type: string
  required: true
  allow_empty: false
  enum:
  - leader
  - member
- key: family_name
  type: string
  required: true
  allow_empty: false
