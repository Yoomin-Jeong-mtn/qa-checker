event: search_result_index_100
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: search_keyword
  type: string
  required: true
  allow_empty: false
- key: related_keyword
  type: string
  required: true
  allow_empty: false
