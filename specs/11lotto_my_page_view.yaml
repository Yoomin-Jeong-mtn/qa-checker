event: 11lotto_my_page_view
properties:
- key: platform
  type: string
  required: true
  allow_empty: false
  enum:
  - ANDROID_APP
  - IOS_APP
  - PC
  - MW
- key: is_logged_in
  type: boolean
  required: true
  allow_empty: false
- key: partner_code
  type: string
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: path
  type: string
  required: true
  allow_empty: false
- key: today_issued_count
  type: number
  required: true
  allow_empty: false
  pattern: ^\d+$
- key: round_issued_count
  type: number
  required: true
  allow_empty: false
  pattern: ^\d+$
